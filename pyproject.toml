[project]
name = "wiki-scraper"
version = "0.1.0"
description = ""
authors = [
    {name = "AntonS",email = "stepanovanton86@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.3,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "python-dotenv (>=1.0.1,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.poetry]
packages = [{ include = "wiki_scraper", from = "src" }]
[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pre-commit = "^4.1.0"
types-requests = "^2.32.0.20241016"
mypy = "^1.15.0"
autoflake = "^2.3.1"

